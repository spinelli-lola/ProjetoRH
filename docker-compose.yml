services:
  db:
    image: mysql:8
    container_name: rh_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rh_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: rh_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"